name: Rate Limiter CI

on:
  push:
  pull_request:

concurrency:
  group: rate-limiter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: digital-ocean/rate-limiter

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            digital-ocean/rate-limiter/pom.xml
            digital-ocean/rate-limiter/**/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: digital-ocean/rate-limiter/**/target/surefire-reports/**
          if-no-files-found: ignore
