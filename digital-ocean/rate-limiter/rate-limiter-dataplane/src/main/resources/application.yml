server:
  port: 8080

spring:
  application:
    name: rate-limiter-dataplane
  data:
    redis:
      host: localhost
      port: 6379

rate-limiter:
  # redis (default) | memory
  store: redis
  config-cache-ttl-ms: 1000
  degraded:
    # When Redis is down: use last-known config + local limits of capacity/N
    enabled: true
    heartbeat-interval-ms: 5000
    heartbeat-ttl-ms: 15000
    # Optional stable id (defaults to random UUID per process)
    # node-id: dataplane-1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        ratelimiter.evaluate: true
      percentiles:
        ratelimiter.evaluate: 0.5, 0.95, 0.99

logging:
  level:
    root: INFO
    com.ratelimiter.dataplane: INFO
    com.ratelimiter.dataplane.service: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{40} - %msg%n"
