services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rate_limiter
      POSTGRES_USER: rate_limiter
      POSTGRES_PASSWORD: rate_limiter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rate_limiter -d rate_limiter"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: rate-limiter-controlplane
    image: rate-limiter-controlplane:local
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rate_limiter
      SPRING_DATASOURCE_USERNAME: rate_limiter
      SPRING_DATASOURCE_PASSWORD: rate_limiter
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  dataplane:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: rate-limiter-dataplane
    image: rate-limiter-dataplane:local
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      RATE_LIMITER_STORE: redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # Second dataplane instance (shared Redis). Enable with:
  #   docker compose --profile multi up -d --build
  dataplane-b:
    profiles: ["multi"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: rate-limiter-dataplane
    image: rate-limiter-dataplane:local
    ports:
      - "8082:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_APPLICATION_NAME: rate-limiter-dataplane-b
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      RATE_LIMITER_STORE: redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
