server:
  port: 8080

spring:
  application:
    name: rate-limiter-dataplane
  data:
    redis:
      host: localhost
      port: 6379

rate-limiter:
  # redis (default) | memory
  store: redis
  config-cache-ttl-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info
