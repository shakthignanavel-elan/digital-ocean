server:
  port: 8081

spring:
  application:
    name: rate-limiter-controlplane
  datasource:
    url: jdbc:postgresql://localhost:5432/rate_limiter
    username: rate_limiter
    password: rate_limiter
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        ratelimiter.configuration: true
      percentiles:
        ratelimiter.configuration: 0.5, 0.95, 0.99

logging:
  level:
    root: INFO
    com.ratelimiter.controlplane: INFO
    com.ratelimiter.controlplane.service: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{40} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:rate_limiter;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
